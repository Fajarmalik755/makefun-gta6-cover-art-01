<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Coast Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>Sunset Coast Cover Studio</h1>
    <p>Build a GTA-style cover from your photos, grades and words.</p>
  </div>
  <div class="top-actions">
    <button id="undo" type="button">Undo</button>
    <button id="redo" type="button">Redo</button>
    <button id="compare" type="button">Hold to Compare</button>
  </div>
</header>
<main class="app">
  <section class="stage">
    <canvas id="cover" width="1080" height="1350" aria-label="The cover preview"></canvas>
    <p class="hint">Click a panel to select it. Drag a panel to pan its photo.</p>
  </section>
  <aside class="panel">
    <section>
      <h2>Layout</h2>
      <div id="layouts" class="choices"></div>
    </section>
    <section>
      <h2>Color grade</h2>
      <div id="grades" class="choices"></div>
    </section>
    <section>
      <h2>Presets</h2>
      <div id="presets" class="choices"></div>
    </section>
    <section>
      <h2>Selected panel</h2>
      <p id="panel-title" class="panel-title"></p>
      <div id="photos" class="photos"></div>
      <label class="upload">Upload your own photo <input id="upload" type="file" accept="image/*"></label>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1.25"></label>
      <div class="row">
        <button id="smartcrop" type="button">Smart Crop</button>
        <label class="tag">Panel tag <input id="tag" type="text" maxlength="12" placeholder="e.g. Heist"></label>
      </div>
    </section>
    <section>
      <h2>Cover text</h2>
      <label>Title <input id="text-title" type="text" maxlength="40"></label>
      <label>Subtitle <input id="text-subtitle" type="text" maxlength="60"></label>
      <label>Quote <input id="text-quote" type="text" maxlength="80"></label>
      <label>Tagline <input id="text-tagline" type="text" maxlength="40"></label>
      <label>Billing line <input id="text-billing" type="text" maxlength="40"></label>
      <label>Seal text <input id="text-seal" type="text" maxlength="3"></label>
      <label>Volume <input id="text-volume" type="text" maxlength="10"></label>
    </section>
    <section>
      <h2>Export PNG</h2>
      <div class="row">
        <button class="export" data-w="1080" data-h="1080" type="button">1080 × 1080</button>
        <button class="export" data-w="1080" data-h="1350" type="button">1080 × 1350</button>
        <button class="export" data-w="1920" data-h="1080" type="button">1920 × 1080</button>
      </div>
      <button id="export-all" type="button">Export All Sizes</button>
    </section>
    <p id="status" role="status"></p>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
